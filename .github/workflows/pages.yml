name: Deploy static site to Pages

on:
  push:
    branches:
      - experiment/ui-playground
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not share a concurrency group with the automatic pages-build-deployment
# workflow, and do not cancel in-progress legacy builds.
concurrency:
  group: pages-actions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only meaningful when repo Pages source is "GitHub Actions".
    # Legacy branch deploys still use pages-build-deployment separately.
    if: github.ref == 'refs/heads/experiment/ui-playground' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
